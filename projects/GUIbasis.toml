# ============================================================
# PGMcpp GUIbasis.toml
# CAD-only, categorized asset input file.
# ============================================================

[paths]
pgmcpp_pybindings = "../pybindings"
electrical_load_time_series = "../data/test/electrical_load/paulatuk_load_20yr_growth_3pct_pgmcpp.csv"

[model]
control_mode = "LOAD_FOLLOWING"
firm_dispatch_ratio = 0.0
load_reserve_ratio = 0.1

[economics]
remote_cost_factor = 3.24
misc_capital_cost_CAD = 0.0

[output]
results_name = "XYZ"


# ============================================================
